<title>Left foot — 52 week ledger</title>
<style>
:root{
  --ink:#161E26;
  --slate:#3E5266;
  --mute:#7C8B99;
  --paper:#E6E9E4;
  --card:#F4F5F2;
  --line:#C9CEC7;
  --ochre:#A8781F;
  --clear:#3F6E52;
  --flare:#9E4128;
  --rest:#B4BCB4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  padding:0 0 calc(90px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}

/* ── masthead ── */
header{padding:22px 0 8px}
.eyebrow{
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--mute);
}
h1{
  font-size:23px;font-weight:800;letter-spacing:-.025em;margin:5px 0 0;line-height:1.15;
}
.sub{font-size:12.5px;color:var(--slate);margin-top:5px}

/* ── today bar ── */
.today{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--ink);color:var(--paper);border-radius:11px;padding:12px 14px;margin-top:14px;
}
.today .tlabel{font-size:14px;font-weight:600;letter-spacing:-.01em}
.today .tsub{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;opacity:.68;letter-spacing:.05em;margin-top:2px}
.jump{
  background:var(--ochre);border:0;color:#161E26;border-radius:7px;padding:8px 13px;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-size:12px;font-weight:600;cursor:pointer;flex:none;
  min-height:34px;
}
.today.setup{display:block}
.today.setup .tsub{margin-bottom:11px;line-height:1.5;opacity:.7}
.datein{
  width:100%;background:transparent;border:1px solid rgba(230,233,228,.3);border-radius:8px;
  color:var(--paper);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:16px;padding:10px 12px;
  margin-bottom:9px;-webkit-appearance:none;appearance:none;color-scheme:dark;
}
.startbtn{
  width:100%;background:var(--ochre);border:0;color:#161E26;border-radius:8px;padding:12px;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-size:16px;font-weight:600;cursor:pointer;min-height:44px;
}

/* ── the rail: 52 weeks at a glance ── */
.rail-box{margin:18px 0 6px}
.rail{
  display:flex;gap:2px;align-items:flex-end;height:34px;
  padding:8px 0 0;touch-action:manipulation;
}
.tick{
  flex:1;height:12px;min-height:12px;background:var(--line);border-radius:1px;
  border:0;padding:0;cursor:pointer;transition:height .18s ease,background .18s ease;
  position:relative;
}
.tick::before{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:100%;height:44px;
}
.tick[data-done="1"]{background:var(--slate)}
.tick[data-flare="1"]{background:var(--flare)}
.tick[data-now="1"]{height:30px;background:var(--ink)}
.phase-bar{display:flex;gap:2px;margin-top:5px}
.pseg{height:3px;border-radius:2px;opacity:.55}
.plabels{display:flex;justify-content:space-between;margin-top:6px}
.plabels span{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;color:var(--mute);letter-spacing:.04em}

/* ── week header ── */
.weekbar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.navbtn{
  width:44px;height:44px;flex:none;border:1px solid var(--line);background:var(--card);
  border-radius:9px;font-size:17px;color:var(--slate);cursor:pointer;line-height:1;
}
.navbtn:disabled{opacity:.32;cursor:default}
.wtitle{flex:1;text-align:center}
.wnum{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.wphase{font-size:16px;font-weight:600;letter-spacing:-.015em;margin-top:1px}

.banner{
  border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:14px;
  border:1px solid var(--line);background:var(--card);
}
.banner.deload{border-color:#C9B98A;background:#F5F0E1}
.banner.gate{border-color:#9FB6A6;background:#EAF1EB}
.banner b{font-weight:600}

/* ── session cards ── */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  margin-bottom:11px;overflow:hidden;
}
.chead{
  display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;
  min-height:44px;
}
.dot{
  width:11px;height:11px;border-radius:50%;flex:none;
  border:2px solid var(--line);background:transparent;
}
.dot.part{border-color:var(--slate);background:linear-gradient(90deg,var(--slate) 50%,transparent 50%)}
.dot.full{border-color:var(--ochre);background:var(--ochre)}
.dot.clear{border-color:var(--clear);background:var(--clear)}
.dot.bad{border-color:var(--flare);background:var(--flare)}
.ctitle{flex:1;font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.cmeta{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;color:var(--mute);letter-spacing:.05em}
.chev{color:var(--mute);font-size:12px;transition:transform .2s}
.card.open .chev{transform:rotate(90deg)}
.cbody{display:none;padding:0 14px 14px}
.card.open .cbody{display:block}

/* ── exercise rows ── */
.exrow{
  display:flex;align-items:center;gap:11px;padding:9px 0;
  border-top:1px solid var(--line);
}
.box{
  width:30px;height:30px;flex:none;border:1.5px solid var(--line);border-radius:7px;
  background:transparent;cursor:pointer;position:relative;padding:0;
}
.box[aria-pressed="true"]{background:var(--slate);border-color:var(--slate)}
.box[aria-pressed="true"]::after{
  content:'';position:absolute;left:10px;top:6px;width:6px;height:12px;
  border:solid #F4F5F2;border-width:0 2px 2px 0;transform:rotate(43deg);
}
.exname{flex:1;font-size:13.5px;line-height:1.3}
.exdose{
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;color:var(--slate);
  text-align:right;white-space:nowrap;line-height:1.35;
}
.exdose i{font-style:normal;color:var(--mute);font-size:9.5px;letter-spacing:.06em}

/* ── 48h verdict ── */
.verdict{margin-top:13px;padding-top:12px;border-top:1.5px dashed var(--line)}
.vlabel{
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ochre);margin-bottom:3px;
}
.vhint{font-size:12px;color:var(--slate);margin-bottom:9px;line-height:1.4}
.vopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vopt{
  border:1px solid var(--line);background:transparent;border-radius:8px;
  padding:9px 8px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-size:12px;cursor:pointer;
  color:var(--slate);text-align:left;line-height:1.25;min-height:44px;
}
.vopt[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vopt b{display:block;font-weight:600;font-size:12.5px}
.vopt span{font-size:10.5px;opacity:.75}
.vresult{
  margin-top:9px;font-size:12.5px;padding:9px 11px;border-radius:8px;line-height:1.4;
}
.vresult.ok{background:#EAF1EB;color:var(--clear)}
.vresult.hold{background:#F5F0E1;color:var(--ochre)}
.vresult.stop{background:#F6E7E1;color:var(--flare)}

/* ── how-to ── */
.howbtn{
  display:inline-block;margin-top:5px;background:transparent;border:0;padding:6px 0;
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ochre);cursor:pointer;border-bottom:1px solid rgba(168,120,31,.4);
}
.howbody{
  margin-top:9px;padding:12px 13px;background:var(--paper);border-radius:9px;
  border-left:2.5px solid var(--ochre);
}
.howwhy{
  margin:0 0 11px;font-size:12px;line-height:1.5;color:var(--slate);font-style:italic;
}
.howsec{margin-bottom:11px}
.howsec:last-child{margin-bottom:0}
.howsec>span{
  display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);margin-bottom:4px;
}
.howsec ul{margin:0;padding-left:16px}
.howsec li{font-size:12.5px;line-height:1.5;margin-bottom:4px}
.howsec p{margin:0;font-size:12.5px;line-height:1.5}
.howsec.err>span{color:var(--flare)}
.howsec.err li{color:var(--flare)}

/* ── daily strip ── */
.daily{margin:16px 0 6px}
.dtitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dtitle h3{font-size:13.5px;font-weight:600;margin:0;letter-spacing:-.01em}
.dtitle em{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-style:normal;font-size:10px;color:var(--mute);letter-spacing:.1em}
.days{display:flex;gap:6px}
.day{
  flex:1;aspect-ratio:1;min-height:44px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;color:var(--mute);cursor:pointer;padding:0;
}
.day[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:var(--card)}
.dnote{font-size:12px;color:var(--slate);margin-top:8px;line-height:1.4}

/* ── retest ── */
.retest{background:var(--ink);color:var(--paper);border-radius:12px;padding:15px;margin:16px 0}
.retest h3{margin:0 0 3px;font-size:15px;font-weight:700;letter-spacing:-.015em}
.retest p{margin:0 0 12px;font-size:12.5px;opacity:.72;line-height:1.4}
.trow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.tname{flex:1;font-size:13px}
.tin{
  width:58px;background:transparent;border:1px solid rgba(230,233,228,.3);border-radius:7px;
  color:var(--paper);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:16px;text-align:center;
  padding:7px 4px;-webkit-appearance:none;appearance:none;color-scheme:dark;
}
.tin:focus{outline:2px solid var(--ochre);outline-offset:1px}
.ttarget{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;opacity:.6;width:52px;text-align:right}
.bar{height:5px;background:rgba(230,233,228,.18);border-radius:3px;overflow:hidden;margin-top:11px}
.barfill{height:100%;background:var(--ochre);border-radius:3px;transition:width .4s ease}
.bartext{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;opacity:.72;margin-top:6px}

/* ── footer ── */
footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.rule{font-size:12px;color:var(--slate);line-height:1.5;margin-bottom:7px;display:flex;gap:8px}
.rule i{font-style:normal;color:var(--mute);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;padding-top:2px}
.reset{
  margin-top:14px;background:transparent;border:1px solid var(--line);color:var(--mute);
  border-radius:8px;padding:11px 13px;font-size:12px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  min-height:44px;
}
.logout{
  display:none;width:100%;min-height:170px;margin-top:11px;padding:11px;
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:16px;line-height:1.5;color:var(--ink);
  resize:vertical;-webkit-appearance:none;appearance:none;
}
.status{
  position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;
  padding:11px 16px calc(11px + env(safe-area-inset-bottom)) 16px;
  display:flex;justify-content:space-between;letter-spacing:.05em;
}
.load{text-align:center;padding:60px 0;color:var(--mute);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Left foot · return to running</div>
    <h1>52 weeks, measured</h1>
    <div class="sub">Nothing is finished when you finish it. Every session closes 48 hours later.</div>
  </header>

  <div id="app"><div class="load">Loading…</div></div>
</div>
<div class="status"><span id="stat">—</span><span id="save">saved</span></div>

<script>
/* ═══════════ PLAN DATA ═══════════ */
const PH = [
  {n:1, name:'Medial sling loading', a:1,  b:12, c:'#3E5266'},
  {n:2, name:'Arch spring',          a:13, b:22, c:'#A8781F'},
  {n:3, name:'Run–walk',             a:23, b:34, c:'#3F6E52'},
  {n:4, name:'Continuous build',     a:35, b:46, c:'#5B6E82'},
  {n:5, name:'5 km',                 a:47, b:52, c:'#161E26'}
];
const phaseOf = w => PH.find(p => w >= p.a && w <= p.b);

const DELOAD = [17,21,27,32,39,44,50];
const RETEST = [6,12,22,34,46];

// Phase 1 — plantar fascia loaded heel raise progression
function pf(w){
  if(w<=1) return ['2 × 6','bodyweight'];
  if(w<=2) return ['3 × 6','bodyweight'];
  if(w<=4) return ['3 × 8','bodyweight'];
  if(w<=6) return ['3 × 10','bodyweight'];
  if(w<=8) return ['3 × 8','+5 kg'];
  if(w<=10) return ['4 × 8','+5 kg'];
  return ['4 × 8','+10 kg'];
}
function inv(w){
  if(w<=2) return ['3 × 8','bodyweight'];
  if(w<=6) return ['3 × 12','bodyweight'];
  return ['3 × 10','+5–10 kg'];
}

function strengthSession(w, maint){
  const p = maint ? ['4 × 8','+10 kg'] : pf(w);
  const i = maint ? ['3 × 10','+10 kg'] : inv(w);
  const items = [
    {n:'Plantar-fascia heel raise', s:'towel under toes · 3s up / 2s hold / 3s down', l:p[0]+' '+p[1], r:'2 × 8'},
    {n:'Seated heavy calf raise', s:'soleus · 3s eccentric', l:'3 × 10', r:'3 × 10'},
    {n:'Inverted-bias heel raise', s:'drive through big toe', l:i[0]+' '+i[1], r:'2 × 8'},
    {n:'Band inversion', s:'slow · 2s in / 3s out', l:'3 × 15', r:'2 × 15'},
    {n:'Single-leg RDL', s:'loaded', l:'3 × 8', r:'3 × 8'},
    {n:'Side plank + abduction', s:'', l:'3 × 20s', r:'3 × 20s'}
  ];
  if(!maint) items.splice(4,0,{n:'Loaded toe flexion', s:'band or weighted towel', l:'3 × 15', r:'2 × 15'});
  return {t:'Strength', meta:'~30 min', items};
}

// Phase 2 — contacts
function impact(w){
  const k = w-12;
  let d, c;
  if(k<=1){d='Double-leg heel bounces, small amplitude';c='3 × 10';}
  else if(k<=2){d='Double-leg heel bounces';c='3 × 20';}
  else if(k<=4){d='Bounces + skipping rope, 30s bouts';c=(k===3?'~60':'~100')+' contacts';}
  else if(k<=5){d='DELOAD — bounces only, half volume';c='~50 contacts';}
  else if(k<=6){d='Alternating / split hops, line hops';c='~120 contacts';}
  else if(k<=8){d='Single-leg hops in place, left';c=(k===7?'3 × 10':'3 × 20');}
  else if(k<=9){d='DELOAD — half volume';c='half';}
  else {d='SL hops: in place → forward-back → lateral';c='50 continuous + 3 × 20';}
  return {t:'Impact', meta:c, items:[
    {n:d, s:'land through ball of foot, big toe engaged — set ends if the arch drops', l:c, r:'half'},
    {n:'Then: strength session', s:'impact always first, while fresh', l:'see below', r:''}
  ]};
}

// Phase 3–5 — running
function runDose(w){
  const R = {
    23:'6 × (1 min jog / 2 min walk)', 24:'6 × (1 min jog / 2 min walk)',
    25:'8 × (1 min jog / 2 min walk)', 26:'8 × (1 min jog / 2 min walk)',
    27:'DELOAD — 6 × (1 / 2)',
    28:'6 × (2 min jog / 2 min walk)', 29:'6 × (2 min jog / 2 min walk)',
    30:'8 × (2 min jog / 1 min walk)', 31:'8 × (2 min jog / 1 min walk)',
    32:'DELOAD — 6 × (2 / 2)',
    33:'5 × (3 min jog / 1 min walk)', 34:'5 × (3 min jog / 1 min walk)',
    35:'4 × (4 min jog / 1 min walk)', 36:'4 × (4 min / 1 min)', 37:'4 × (4 min / 1 min)',
    38:'3 × (6 min / 1 min)', 39:'DELOAD — 3 × (4 / 1)', 40:'3 × (8 min / 1 min)',
    41:'3 × (8 min / 1 min)', 42:'2 × (12 min / 2 min)', 43:'2 × (12 min / 2 min)',
    44:'DELOAD — 2 × (8 / 2)', 45:'20 min continuous', 46:'20 min continuous',
    47:'25 min continuous', 48:'25 min continuous', 49:'30 min continuous',
    50:'DELOAD — 20 min continuous', 51:'35 min continuous', 52:'5 km continuous'
  };
  return R[w] || '—';
}

function buildWeek(w){
  const p = phaseOf(w), dl = DELOAD.includes(w);
  const out = {w, phase:p, deload:dl, sessions:[], daily:'', walk:'', banner:null, gate:null};

  if(p.n === 1){
    out.sessions = [
      {...strengthSession(w,false), t:'Session 1'},
      {...strengthSession(w,false), t:'Session 2'},
      {...strengthSession(w,false), t:'Session 3'}
    ];
    out.daily = 'Loaded big toe press 3 × 10 (3s hold) · weighted short foot 3 × 20–30s';
    out.walk = w<9 ? 'Steps: hold 7,000–8,500/day average (baseline 7,680). No single day over 12,000. Do not build walking while building strength.'
                   : 'Steps: hold 7,000–8,500/day. Hills allowed, within the same daily total. Check the weekly average each Sunday.';
    if(w===1) out.banner = {k:'', t:'<b>Week 1 sits deliberately below what you can do.</b> Two sets of six when your max is ten will feel pointless. Its only job is to establish a clean 48-hour response before anything gets loaded.'};
    if(w===12) out.gate = {t:'<b>Phase 1 gate.</b> Left ≥15 towel-loaded and ≥22 inverted (75% of right). If short, extend Phase 1 — the clock is not the gate.'};
  }
  else if(p.n === 2){
    out.sessions = [
      {...impact(w), t:'Session 1 · impact'},
      {...strengthSession(w,true), t:'Session 2 · strength'},
      {...impact(w), t:'Session 3 · impact'}
    ];
    out.daily = 'Loaded big toe press 3 × 10 · weighted short foot 3 × 20–30s';
    out.walk = 'Maintain 8–10k steps/day. Walking is now background load, not a target.';
    if(w===13) out.banner = {k:'', t:'<b>The phase you have never done.</b> Six years without spring loading means the arch has no elastic tolerance. Do not compress this.'};
    if(w===22) out.gate = {t:'<b>Gate to running.</b> 50 controlled single-leg hops left, clean at 48h, and left ≥18 towel-loaded / ≥27 inverted (90% of right).'};
  }
  else {
    const three = w >= 31;
    const rs = {t:'Run', meta:'easy pace · cadence 170–180', items:[
      {n:runDose(w), s:'conversational pace only · flat even surface · orthotics', l:'as prescribed', r:''},
      {n:'Total time on feet under 90 min today', s:'a long walk on a run day is a hidden double dose', l:'cap', r:''}
    ]};
    out.sessions = [{...rs, t:'Run A'}, {...rs, t:'Run B'}];
    if(three) out.sessions.push({...rs, t:'Run C'});
    out.sessions.push({...strengthSession(w,true), t:'Strength A'});
    out.sessions.push({...strengthSession(w,true), t:'Strength B'});
    out.daily = 'Loaded big toe press 3 × 10 · weighted short foot 3 × 20–30s';
    out.walk = 'Never run on consecutive days. Never make up a missed session.';
    if(w===23) out.banner = {k:'', t:'<b>First run in six years.</b> One minute at a time. Progress one variable only — jog duration or rep count, never both.'};
    if(w===52) out.gate = {t:'<b>5 km.</b> Hold this comfortably for 6–8 weeks before extending anything.'};
  }
  return out;
}

function howFor(name){
  if(HOW[name]) return HOW[name];
  const k = Object.keys(HOW).find(x => name.indexOf(x) === 0 || name.indexOf(x) > -1);
  if(k) return HOW[k];
  if(/hops/i.test(name)) return HOW['Single-leg hops'];
  if(/bounce|skipping/i.test(name)) return HOW['Double-leg heel bounces'];
  return null;
}
function howHTML(name){
  const h = howFor(name);
  if(!h) return '';
  const open = HOWOPEN[name];
  let inner = '';
  if(open){
    inner = `<div class="howbody">
      <p class="howwhy">${h.why}</p>
      <div class="howsec"><span>Set up</span><ul>${h.setup.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="howsec"><span>Do it</span><ul>${h.doit.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="howsec"><span>Progress</span><p>${h.load}</p></div>
      <div class="howsec err"><span>Common errors</span><ul>${h.errors.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </div>`;
  }
  return `<button class="howbtn" data-how="${name.replace(/"/g,'')}">${open?'Hide':'How to do this'}</button>${inner}`;
}

/* ═══════════ STORAGE ═══════════
   Prefer a host-provided window.storage bridge if one is present (some
   embedding environments inject this). Otherwise fall back to
   localStorage so the tracker works as a plain saved/home-screen page in
   mobile Safari. If neither is available (e.g. private-mode quota
   errors), fall back to an in-memory store for the session so the app
   never hard-fails, even though nothing will persist across reloads. */
const KEY = 'foot-plan-v1';
let memStore = {};
function hasLocalStorage(){
  try{
    const t = '__lf_test__';
    localStorage.setItem(t, t);
    localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}
const LS_OK = hasLocalStorage();
async function storageGet(key){
  if(window.storage && typeof window.storage.get === 'function'){
    try{ return await window.storage.get(key); }catch(e){ /* fall through */ }
  }
  if(LS_OK){
    const v = localStorage.getItem(key);
    return v === null ? null : {value:v};
  }
  return memStore.hasOwnProperty(key) ? {value:memStore[key]} : null;
}
async function storageSet(key, value){
  if(window.storage && typeof window.storage.set === 'function'){
    try{ await window.storage.set(key, value); return; }catch(e){ /* fall through */ }
  }
  if(LS_OK){
    localStorage.setItem(key, value);
    return;
  }
  memStore[key] = value;
}

/* ═══════════ STATE ═══════════ */
let S = {cur:1, start:null, weeks:{}, tests:{}};
let saveTimer = null;

const DAY = 86400000;
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function currentWeek(){
  if(!S.start) return null;
  const s = new Date(S.start+'T00:00:00');
  const n = new Date(todayISO()+'T00:00:00');
  const w = Math.floor((n - s)/(7*DAY)) + 1;
  return Math.max(1, Math.min(52, w));
}
function dayLabel(){
  return new Date().toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});
}

async function load(){
  try{
    if(navigator.storage && navigator.storage.persist) await navigator.storage.persist();
  }catch(e){ /* not supported everywhere; harmless */ }
  try{
    const r = await storageGet(KEY);
    if(r && r.value) S = Object.assign(S, JSON.parse(r.value));
  }catch(e){ /* first run — no key yet */ }
  const cw = currentWeek();
  if(cw) S.cur = cw;
  render();
}

/* If this page is opened as a static preview (e.g. iOS Quick Look, which
   shows this HTML but does not run scripts) this script never gets this
   far, so this line never fires. As a second line of defence, if the
   #app div is still showing the initial "Loading…" placeholder a couple
   of seconds after the page appeared, replace it with instructions
   rather than leaving it stuck silently. */
function watchdog(){
  const app = document.getElementById('app');
  if(app && app.querySelector('.load')){
    app.innerHTML = `<div class="load" style="text-align:left;color:var(--ink)">
      <b>Stuck loading?</b><br><br>
      If you opened this from Messages, Files, or an attachment, it likely opened in
      Quick Look, which shows the page but can't run its script.<br><br>
      Tap the <b>Share</b> icon and choose <b>Open in Safari</b> (or save it to Files
      first, then open it from there in Safari). Once it's running in Safari you can
      use Share → <b>Add to Home Screen</b> so it opens this way every time.
    </div>`;
  }
}
setTimeout(watchdog, 2500);
function save(){
  document.getElementById('save').textContent = 'saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await storageSet(KEY, JSON.stringify(S));
      document.getElementById('save').textContent = 'saved';
    }catch(e){
      document.getElementById('save').textContent = 'not saved — retry';
    }
  }, 400);
}
const wk = w => (S.weeks[w] = S.weeks[w] || {done:{}, verdict:{}, days:{}, open:null});

/* ═══════════ RENDER ═══════════ */

  if(RETEST.includes(w)){

function buildLog(){
  const V = {ok:'clean', mild:'mild', hold:'present at 48h', stop:'WARNING SIGNS'};
  let out = 'FOOT REHAB LOG — exported ' + todayISO() + '\n';
  out += 'Start date: ' + (S.start || 'not set') + '\n';
  const cw = currentWeek();
  if(cw) out += 'Currently week ' + cw + ' of 52 (Phase ' + phaseOf(cw).n + ' — ' + phaseOf(cw).name + ')\n';
  out += '\n';

  const tw = Object.keys(S.tests).sort((a,b)=>a-b);
  if(tw.length){
    out += 'RE-TESTS (left foot, max reps)\n';
    tw.forEach(k=>{
      const t = S.tests[k];
      out += '  Week ' + k + ': plantar-fascia ' + (t.pf||'—') + ' / inverted ' + (t.iv||'—')
           + '   [baseline wk0: 10 / 15 · right foot: 20 / 30]\n';
    });
    out += '\n';
  }

  out += 'SESSIONS\n';
  const ws = Object.keys(S.weeks).map(Number).sort((a,b)=>a-b);
  let any = false;
  ws.forEach(n=>{
    const st = S.weeks[n], D = buildWeek(n);
    const lines = [];
    D.sessions.forEach((s,i)=>{
      const d = (st.done[i]||[]).length;
      if(!d && !st.verdict[i]) return;
      lines.push('    ' + s.t + ': ' + d + '/' + s.items.length
                 + (st.verdict[i] ? ' → 48h ' + V[st.verdict[i]] : ' → 48h not scored'));
    });
    const dd = Object.values(st.days||{}).filter(Boolean).length;
    if(!lines.length && !dd) return;
    any = true;
    out += '  Week ' + n + ' (Phase ' + D.phase.n + (D.deload ? ', deload' : '') + ')\n';
    lines.forEach(l => out += l + '\n');
    if(dd) out += '    Daily arch work: ' + dd + '/7 days\n';
  });
  if(!any) out += '  Nothing logged yet.\n';

  out += '\nNOTES\n  (add anything here before sending — flares, missed sessions, how it felt)\n';
  return out;
}

/* Backup: iOS may clear this app's storage, most likely after a long
   break, since using the app resets Apple's timer. */
const MS_DAY = 86400000;
function daysSinceBackup(){
  if(!S.lastBackup) return null;
  const t = Date.parse(S.lastBackup);
  if(isNaN(t)) return null;
  return Math.floor((Date.now() - t)/MS_DAY);
}
function anythingLogged(){
  const ws = S.weeks || {};
  for(const k in ws){
    const w = ws[k] || {};
    const a = Object.values(w.done || {}).some(x => x && x.length);
    const b = Object.values(w.verdict || {}).some(Boolean);
    const c = Object.values(w.days || {}).some(Boolean);
    if(a || b || c) return true;
  }
  return Object.keys(S.tests || {}).length > 0;
}
function backupNudge(){
  if(!anythingLogged()) return '';
  const d = daysSinceBackup();
  if(d !== null && d < 30) return '';
  const msg = (d === null) ? 'You have logged sessions but never backed up.' : ('Last backup was ' + d + ' days ago.');
  return '<div class="banner deload" style="margin:14px 0 0"><b>Back up your log.</b> ' + msg +
         ' Tap <b>Back up data</b> below and keep the code somewhere safe.</div>';
}

function bind(){
  const sd = document.getElementById('setstart');
  if(sd) sd.onclick = ()=>{
    const v = document.getElementById('startdate').value;
    if(!v) return;
    S.start = v;
    S.cur = currentWeek() || 1;
    render(); save();
  };
  const j = document.getElementById('jump');
  if(j) j.onclick = ()=>{ S.cur = currentWeek(); render(); save(); };

  document.querySelectorAll('.tick').forEach(b=> b.onclick = ()=>{ S.cur = +b.dataset.w; render(); save(); });
  const p = document.getElementById('prev'), n = document.getElementById('next');
  if(p) p.onclick = ()=>{ S.cur = Math.max(1, S.cur-1); render(); save(); };
  if(n) n.onclick = ()=>{ S.cur = Math.min(52, S.cur+1); render(); save(); };

  document.querySelectorAll('.chead').forEach(h=> h.onclick = ()=>{
    const st = wk(S.cur), i = +h.dataset.open;
    st.open = st.open === i ? null : i;
    render(); save();
  });

  document.querySelectorAll('.box').forEach(b=> b.onclick = ()=>{
    const st = wk(S.cur), s = +b.dataset.s, i = +b.dataset.i;
    st.done[s] = st.done[s] || [];
    const at = st.done[s].indexOf(i);
    if(at >= 0) st.done[s].splice(at,1); else st.done[s].push(i);
    st.open = s;
    render(); save();
  });

  document.querySelectorAll('.howbtn').forEach(b=> b.onclick = (e)=>{
    e.stopPropagation();
    const k = b.dataset.how;
    HOWOPEN[k] = !HOWOPEN[k];
    render();
  });

  document.querySelectorAll('.vopt').forEach(b=> b.onclick = ()=>{
    const st = wk(S.cur), s = +b.dataset.s;
    st.verdict[s] = st.verdict[s] === b.dataset.v ? null : b.dataset.v;
    st.open = s;
    render(); save();
  });

  document.querySelectorAll('.day').forEach(b=> b.onclick = ()=>{
    const st = wk(S.cur), i = +b.dataset.d;
    st.days[i] = !st.days[i];
    render(); save();
  });

  ['pf','iv'].forEach(k=>{
    const el = document.getElementById('t-'+k);
    if(el) el.onchange = ()=>{
      S.tests[S.cur] = S.tests[S.cur] || {};
      S.tests[S.cur][k] = +el.value || null;
      render(); save();
    };
  });

  const ex = document.getElementById('export');
  if(ex) ex.onclick = async ()=>{
    const txt = buildLog();
    const ta = document.getElementById('logout');
    ta.value = txt;
    ta.style.display = 'block';
    try{
      await navigator.clipboard.writeText(txt);
      ex.textContent = 'Copied — paste it into the chat';
    }catch(e){
      ta.select();
      ex.textContent = 'Select the text below and copy';
    }
    setTimeout(()=>{ ex.textContent = 'Copy log for review'; }, 6000);
  };

  const bk = document.getElementById('backup');
  if(bk) bk.onclick = async ()=>{
    const code = JSON.stringify({v:1, start:S.start, weeks:S.weeks, tests:S.tests});
    const ta = document.getElementById('logout');
    ta.value = code;
    ta.style.display = 'block';
    S.lastBackup = new Date().toISOString();
    try{
      await navigator.clipboard.writeText(code);
      bk.textContent = 'Copied — paste it somewhere safe';
    }catch(e){
      ta.select();
      bk.textContent = 'Select the text above and copy';
    }
    save();
    setTimeout(()=>{ bk.textContent = 'Back up data'; }, 6000);
  };

  const rs = document.getElementById('restore');
  if(rs) rs.onclick = ()=>{
    const box = document.getElementById('restorebox');
    box.style.display = (box.style.display === 'none') ? 'block' : 'none';
  };

  const dr = document.getElementById('dorestore');
  if(dr) dr.onclick = ()=>{
    const msg = document.getElementById('restoremsg');
    const raw = (document.getElementById('restorein').value || '').trim();
    if(!raw){
      msg.style.color = 'var(--flare)';
      msg.textContent = 'Nothing pasted.';
      return;
    }
    let d = null;
    try{
      d = JSON.parse(raw);
    }catch(e){
      msg.style.color = 'var(--flare)';
      msg.textContent = 'That does not look like a backup code. Paste the whole thing.';
      return;
    }
    if(!d || typeof d !== 'object' || (!d.weeks && !d.tests)){
      msg.style.color = 'var(--flare)';
      msg.textContent = 'That is not a tracker backup.';
      return;
    }
    S.start = d.start || S.start;
    S.weeks = d.weeks || {};
    S.tests = d.tests || {};
    S.cur = currentWeek() || 1;
    msg.style.color = 'var(--clear)';
    msg.textContent = 'Restored.';
    render(); save();
  };

  const r = document.getElementById('reset');
  if(r) r.onclick = ()=>{
    S.weeks[S.cur] = {done:{}, verdict:{}, days:{}, open:null};
    render(); save();
  };
}

load().catch(e=>{
  const app = document.getElementById('app');
  if(app) app.innerHTML = `<div class="load" style="text-align:left;color:var(--flare)">
    <b>Something went wrong loading the tracker.</b><br><br>
    ${(e && e.message) ? e.message : String(e)}<br><br>
    Try closing and reopening the page. If it keeps happening, screenshot this message.
  </div>`;
});
</script>
</body>
</html>
